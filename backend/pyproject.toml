[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmates"
version = "0.1.0"
description = "Self-hosted dashboard that puts your household's Garmin data side by side"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "James Ford" }]
keywords = ["garmin", "garmin-connect", "health", "fitness", "sleep", "hrv", "dashboard",
            "self-hosted", "quantified-self"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "garmin-connect-personal-api-python==1.0.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "fitdecode>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/Jamesemf/garmates"
Documentation = "https://github.com/Jamesemf/garmates/tree/main/docs"
Issues = "https://github.com/Jamesemf/garmates/issues"
Changelog = "https://github.com/Jamesemf/garmates/blob/main/CHANGELOG.md"

[project.scripts]
garmates = "garmates.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["garmates"]
