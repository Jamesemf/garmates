# Always-on deployment for a Raspberry Pi, NAS or any Docker host.
#   docker compose up -d
# Then open http://<host-ip>:8000 from any device on your network.
#
# Compose pulls the prebuilt image (amd64 or arm64) and only builds from source if it
# can't. Update with:  docker compose pull && docker compose up -d
# Build locally instead with:  docker compose up -d --build

# Fixed project name, so containers and volumes are called garmates* whatever the folder is.
name: garmates

services:
  dashboard:
    image: ghcr.io/jamesemf/garmates:${GARMATES_VERSION:-latest}
    build: .
    container_name: garmates
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Your local time zone - syncing and day views use "today" in this zone. Set TZ in .env.
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    volumes:
      # Database, encrypted Garmin keys (secrets/master.key) and FIT files.
      # Back this volume up - see docs/installation.md "Backups".
      - dashboard-data:/data

volumes:
  dashboard-data:
