<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garmates social card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 0% 0%, rgba(57, 135, 229, 0.18), transparent 60%),
      radial-gradient(700px 500px at 100% 100%, rgba(217, 89, 38, 0.16), transparent 60%),
      #0d0d0d;
    color: #f0efec;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 88px; width: 520px; }
  .logo svg { width: 84px; height: 84px; display: block; border-radius: 20px; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -2px; margin-top: 28px; line-height: 1; }
  p { font-size: 30px; line-height: 1.3; color: #c3c2b7; margin-top: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; }
  .chip {
    font-size: 18px; color: #f0efec; padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.05);
  }
  .shot {
    position: absolute; left: 640px; top: 64px; width: 860px;
    border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="logo">{{LOGO}}</div>
    <h1>Garmates</h1>
    <p>Your Garmin stats, side by side with the people you live with.</p>
    <div class="chips">
      <span class="chip">Self-hosted</span>
      <span class="chip">Garmin Personal API</span>
      <span class="chip">Docker · Raspberry Pi</span>
      <span class="chip">Open source</span>
    </div>
  </div>
  <img class="shot" src="{{HERO}}" alt="">
</body>
</html>
