name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml)
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/src/garmates/__init__.py)
          if [ "$version" != "$package" ] || [ "$version" != "$module" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject ($package) / __init__ ($module)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # GHCR image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || index($0, "[") == 1) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Install or update"
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64)"
          } > release-body.md
          gh release create "$GITHUB_REF_NAME" --title "Garmates $VERSION" --notes-file release-body.md --verify-tag
