name: Bug report
description: Something in Garmates doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If the problem is that **Garmin data looks wrong** (missing days,
        odd values), the [Garmin data form](https://github.com/Jamesemf/garmates/issues/new?template=garmin_data.yml)
        will get it fixed faster.

        **Never paste your Garmin Personal API key, a bearer token or anything from `data/secrets`.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open People & keys
        2. Press Sync now
        3. ...
  - type: input
    id: version
    attributes:
      label: Garmates version
      description: The release (e.g. 0.1.0) or the commit you're running.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker (plain HTTP)
        - Docker with the HTTPS overlay
        - Windows (start.cmd / conda)
        - macOS or Linux from source
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Host and browser
      placeholder: e.g. Raspberry Pi 5 + Safari on iPhone
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output around the time it happened (`docker compose logs dashboard` or the terminal running `garmates serve`).
      render: text
